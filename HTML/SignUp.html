<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TuComunidadCR | Sign Up</title>
    <link rel="stylesheet" href="../Css/SignUp.css" />
  </head>
  <body>
    <main>
      <!-- Columna izquierda: formulario -->
      <section id="login-form-section">
        <!-- Logo -->
        <div id="logo-container">
          <img
            id="logo-img"
            src="../Images/logoWhite.png"
            alt="Logo TuComunidadCR"
            width="50"
          />
          <h2 id="logo-text">TuComunidadCR</h2>
          <!-- Título -->
        </div>

        <h1 id="login-title">
          Crear tu <span id="title-accent"> Cuenta</span>
        </h1>

        <!-- Formulario de registro -->
        <form id="login-form" action="Main.html" method="post">
          <!-- Nombre -->
          <div class="form-group">
            <label for="name-input">Nombre</label>
            <input id="name-input" type="text" name="nombre" required />
            <span id="SignNombreError" class="error-message"></span>
          </div>

          <!-- Teléfono -->
          <div class="form-group">
            <label for="phone-input">Teléfono</label>
            <input id="phone-input" type="tel" name="telefono" required />
            <span id="SignTelefonoError" class="error-message"></span>
          </div>

          <!-- Correo -->
          <div class="form-group">
            <label for="email-input">Correo</label>
            <input id="email-input" type="email" name="correo" required />
            <span id="SignEmailError" class="error-message"></span>
          </div>

          <!--buscar como poner el maximo como fecha actual -->
          <!-- Fecha de nacimiento -->
          <div class="form-group">
            <label for="birthdate-input">Fecha de nacimiento</label>
            <input
              id="birthdate-input"
              type="date"
              min="1900-01-01"
              max="2026-06-01" 
              name="fecha_nacimiento"
              required
            />
            <span id="SignFechaError" class="error-message"></span>
          </div>

          <!-- Usuario -->
          <div class="form-group">
            <label for="username-input">Usuario</label>
            <input id="username-input" type="text" name="username" required />
            <span id="SignUserError" class="error-message"></span>
          </div>

          <!-- Contraseña -->
          <div class="form-group">
            <label for="password-input">Contraseña</label>
            <input
              id="password-input"
              type="password"
              name="password"
              required
            />
            <span id="SignPasswordError" class="error-message"></span>
          </div>

          <!-- Mensaje feedback general -->
          <div id="globalMessage" class="global-message"></div>

          <!-- Botones -->
          <div id="buttons-container">
            <button id="login-btn" type="submit">Registrarse</button>
            <button
              id="register-btn"
              type="button"
              onclick="location.href = 'LogIn.html'"
            >
              Iniciar Sesión
            </button>
          </div>
        </form>
      </section>
    </main>
    <Script src="../JS/scriptSign.js"></Script>
  </body>
</html>
