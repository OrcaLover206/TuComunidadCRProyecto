<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TuComunidadCR | Log In</title>
    <link rel="stylesheet" href="../Css/LogInCss.css" />
  </head>
  <body>
    <main>
      <!-- Columna izquierda: formulario -->
      <section id="login-form-section">
        <div id="logo-container">
          <img
            id="logo-img"
            src="../Images/logoWhite.png"
            alt="Logo TuComunidadCR"
            width="50"
          />
          <h2 id="logo-text">TuComunidadCR</h2>
        </div>
        <h1 id="login-title">
          Iniciar tu <span id="title-accent"> Cuenta</span>
        </h1>
        <form id="login-form" action="Main.html" method="post">
          <div class="form-group">
            <label for="username-input">Usuario</label>
            <input id="username-input" type="text" name="username" required />
            <span id="usernameError" class="error-message"></span>
          </div>

          <div class="form-group">
            <label for="password-input">Contraseña</label>
            <input
              id="password-input"
              type="password"
              name="password"
              required
            />
            <span id="passwordError" class="error-message"></span>
          </div>

          <div id="globalMessage" class="global-message"></div>
          <div id="buttons-container">
            <button id="login-btn" type="submit">Iniciar</button>
            <button
              id="register-btn"
              type="button"
              onclick="location.href = './Sign.html'"
            >
              Crear Cuenta
            </button>
          </div>
        </form>
      </section>
    </main>
  </body>
  <script src="../JS/scriptLogin.js"></script>
</html>
