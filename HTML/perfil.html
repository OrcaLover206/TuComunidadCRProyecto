<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MiComunidadCR sera el punto de encuentro para la participación ciudadana en actividades municipales."
    />
    <meta
      name="keywords"
      content="MiComunidadCR, Costa Rica, Aire libre, actividades municipales, convivencia"
    />
    <meta name="author" content="MiComunidadCR" />

    <!-- CSS externo principal del sitio -->
    <link rel="stylesheet" href="../CSS/PerfilCss.css" />

    <!-- Icono del sitio -->
    <link rel="icon" href="../IMAGES/logoGREY.jpeg" type="image/png" />
    <title>MiComunidadCR | Perfil Usuario</title>
  </head>
  <body>
    <nav>
      <ul class="nav-left">
        <img
          src="../IMAGES/logoGREY.jpeg"
          alt="Logo TuComunidadCR"
          class="nav-logo"
        />
        <a href="./Main.html" class="nav-title">TuComunidadCR</a>
        <ul id="menuSinCuenta" style="display: none">
          <li><a href="./Login.html">Iniciar Sesion</a></li>
          <li><a href="./SignUp.html">Registrarse</a></li>
        </ul>
        <ul id="submenu" style="display: none">
          <li><a href="./perfil.html">Perfil</a></li>
          <li><a href="./Eventos.html">Tus Eventos</a></li>
          <li><a href="./Main.html">Pagina Principal</a></li>
          <li><a href="#" onclick="confirmLogout()">Salir</a></li>
        </ul>
      </ul>

      <a href="#" onclick="toggleMenu()" class="nav-cuenta">Cuenta</a>
    </nav>

    <div id="bienvenida">
      <h1>Perfil de Usuario</h1>
    </div>

    <main>
      <form id="formPerfil">
        <label for="Id">ID:</label>
        <input type="text" id="Id" name="Id" /><br />

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" />
        <span id="nombreError"></span><br />

        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" />
        <span id="emailError"></span><br />

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono" />
        <span id="telefonoError"></span><br />

        <button type="button" id="btnEditar">Editar</button>
        <button type="submit">Guardar Cambios</button>
      </form>
    </main>
    <br />
    <footer>
      <img src="../IMAGES/logoBlack.png" alt="Logo TuComunidadCR" width="30" />
      <ul>
        <li>About us</li>
        <li>Ayuda</li>
        <li>Contacto</li>
      </ul>
      <hr />
      <p>&copy; 2024 Eventos de la Comunidad. Todos los derechos reservados.</p>
    </footer>
    <script src="../JS/scriptPerfil.js"></script>
  </body>
</html>
