<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="MiComunidadCR sera el punto de encuentro para la participación ciudadana en actividades municipales.">
    <meta name="keywords" content="MiComunidadCR, Costa Rica, Aire libre, actividades municipales, convivencia">
    <meta name="author" content="MiComunidadCR">

    <!-- CSS externo principal del sitio -->
    <link rel="stylesheet" href="">

    <!-- Icono del sitio -->
    <link rel="icon" href="img/cambiar.png" type="image/png">
    <title> MiComunidadCR | Registro</title>
</head>
<body>
    <header>
        <img src="img/logoMicomunidad.jpeg" alt="Logo de MiComunidadCR" width="32">
        <p class="logo"><strong>MiComunidadCR</strong></p>
        <label><a href="cuenta.html"> Cuenta</a></label>
    </header>
    <main>
        <h2>Registro</h2>
        <form action="registro.html" method="post">

            <label for="Ced">Cédula:</label>
            <input type="text" id="Ced" name="Cedula" required><br><br>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" name="telefono" required><br><br>

            <button type="submit">Registrarse</button>
        </form>
    </main>
    <br>
    <footer>
        <a> Contacto</a>
        <a> Ayuda</a>
        <a> Sobre Nosotros</a>
        <hr>
        <p>&copy; 2026 MiComunidadCR. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
